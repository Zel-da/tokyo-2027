<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<title>도쿄 설날 여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도쿄 여행">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 담백한 앱 스타일: 흰 바탕, 한 가지 강조색, 한 줄 목록 + 눌러서 펼치기 */
:root{
  --bg:#FFFFFF; --sub:#F6F6F7; --ink:#17171A; --mute:#6E6E76; --faint:#6E6E76; --line:#EDEDF0;
  --acc:#E5484D; --acc-soft:#FDEDED; --ok:#15803D; --ok-soft:#E8F7EE; --blue:#2563EB;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111113; --sub:#1B1B1E; --ink:#EDEDEF; --mute:#A0A0A8; --faint:#8A8A93; --line:#26262A;
  --acc:#FF6369; --acc-soft:#3A1A1C; --ok:#3DD68C; --ok-soft:#14301F; --blue:#6B9BFF; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* 헤더 */
.top{padding-top:28px;padding-bottom:18px}
.eyebrow{margin:0;color:var(--mute);font-size:13px}
h1{margin:4px 0 16px;font-size:28px;font-weight:700;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--sub);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}

/* 탭 */
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;padding:13px 10px 11px;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding-top:24px;padding-bottom:80px}
.date{margin:0;color:var(--acc);font-size:13px;font-weight:600}
h2{margin:4px 0 8px;font-size:22px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.lead{margin:0;color:var(--mute);font-size:14.5px}
h3{font-size:13px;font-weight:600;color:var(--mute);margin:28px 0 8px}

.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:14px 0 0;font-size:13.5px}
.facts dt{color:var(--faint)}
.facts dd{margin:0}
.note{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--acc-soft);font-size:13px;line-height:1.5}
.note b{font-weight:600}

/* 지도 */
.mapcard{margin:20px 0 0;border-radius:16px;overflow:hidden;background:var(--sub);position:relative;isolation:isolate}
.map{height:240px}
.mapbar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.cap{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--mute);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cap b{color:var(--ink);font-weight:600}
.pill{border:0;border-radius:999px;padding:7px 14px;min-height:40px;min-width:40px;font-size:13px;font-weight:600;background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
.pill.ghost{background:var(--bg);color:var(--ink)}
.mylive{padding:0 14px 12px;font-size:13px;display:grid;gap:2px;color:var(--mute)}
.mylive b{color:var(--ink)}
.mylive .ok{color:var(--ok);font-weight:600}
.leaflet-container{font-family:var(--font);background:var(--sub)}
.leaflet-tile-pane{filter:grayscale(1) contrast(.9) brightness(1.04)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:grayscale(1) invert(.92) contrast(.85) brightness(.9)}}
.stop span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #17171A;color:#17171A;font-size:9px;font-weight:700}
.stop.gacha span{width:22px;height:22px;border-color:#7C3AED;font-size:12px}
.stop.cafe span{border-color:#B45309;font-size:10px}
.mv{position:relative;width:40px;height:46px}
.mv b{position:absolute;left:2px;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;border:2.5px solid var(--mc);box-shadow:0 6px 14px rgba(0,0,0,.25);animation:hop .9s ease-in-out infinite}
.mv i{position:absolute;left:11px;bottom:0;width:18px;height:5px;border-radius:50%;background:rgba(0,0,0,.25);animation:shade .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shade{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.7);opacity:.18}}

/* 진행률 */
.prog{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

/* 일정 목록 */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px 1fr;gap:0 10px;align-items:start;border-bottom:1px solid var(--line)}
.ck{position:relative;width:22px;height:22px;margin-top:15px;border-radius:50%;border:1.5px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:12px;padding:0}
.ck::before{content:"";position:absolute;inset:-11px}
.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ck:disabled{opacity:.4}
details.it>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:46px 1fr 14px;gap:0 8px;padding:14px 0;align-items:start}
details.it>summary::-webkit-details-marker{display:none}
.tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);padding-top:1px}
.tt{font-size:15.5px;font-weight:600;line-height:1.4}
.mt{display:block;font-size:12.5px;color:var(--mute);font-weight:400;margin-top:2px}
.mt .who{color:var(--ok)}
.chev{color:var(--faint);font-size:12px;padding-top:3px;transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.body{padding:0 0 16px 54px;font-size:14px;color:var(--ink)}
.body p{margin:0 0 8px}
.body ul,.body ol{margin:0 0 8px;padding-left:18px}
.body li{margin:2px 0}
.body .tags{color:var(--mute);font-size:13px;margin:6px 0 0}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a,.links button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:12.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.row.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.row.now .tm{color:var(--acc)}
.row.now .tt::before{content:"지금 ";color:var(--acc);font-size:12px;font-weight:700}
.row.cafe .tm{color:#B45309}
.row.onmap{background:var(--sub)}
.mv-row{list-style:none;padding:6px 0 6px 38px;font-size:12.5px;color:var(--faint);border-bottom:1px solid var(--line)}
.krw{color:var(--faint);font-size:.92em;margin-left:2px;white-space:nowrap}

/* 접는 섹션 */
details.fold{border-top:1px solid var(--line);margin-top:8px}
details.fold>summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;display:flex;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--faint);font-weight:400}
details.fold[open]>summary::after{content:"－"}
details.fold .inner{padding:0 0 16px;font-size:14px}
details.fold .inner ul{margin:0;padding-left:18px}
details.fold .inner li{margin:4px 0}

/* 지금 · 다음 카드 */
.nowcard{margin:16px 0 0;border-radius:16px;background:var(--ink);color:var(--bg);padding:16px}
.nowcard .k{font-size:12px;opacity:.6;font-weight:600}
.nowcard .v{font-size:17px;font-weight:700;margin:2px 0 10px;line-height:1.35}
.nowcard .v small{font-size:13px;font-weight:500;opacity:.75}
.nowcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.nowcard .acts a,.nowcard .acts button{border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.nowcard ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.nowcard li{margin:3px 0}
/* 이름 안내 */
.toast{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg)}
.toast .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast input{flex:1;min-width:120px;font:inherit;border:0;border-radius:10px;padding:9px 12px}
.toast button{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
#toastskip{background:transparent;color:var(--bg);opacity:.8}
/* 보여주기 카드 */
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phr button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--mute)}
.phr button b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.big-overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center;cursor:pointer}
.big-overlay .jp{font-size:clamp(34px,10vw,64px);font-weight:700;line-height:1.3;letter-spacing:-.02em}
.big-overlay .jp small{display:block;margin-top:18px;font-size:.5em;font-weight:600;line-height:1.5}
.big-overlay .nw{white-space:nowrap}
.big-overlay .ko{margin-top:16px;color:var(--mute);font-size:16px}
/* A안/B안 선택 */
.optbox{margin:16px 0 0}
.optbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optbtns button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;min-height:64px}
.optbtns button b{display:block;font-size:15px}
.optbtns button span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.optbtns button[aria-pressed="true"]{border-color:var(--ink);background:var(--sub)}
.optbtns button[aria-pressed="true"] b::before{content:"✓ "}
.optdesc{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--sub);font-size:13.5px;line-height:1.6}
/* 칩 필터 */
.chips{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 카드 */
.card{background:var(--sub);border-radius:16px;padding:16px;margin-top:12px}
.card h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--mute)}
.spark{width:100%;height:70px;display:block;margin-top:8px}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.spark .lo{fill:var(--acc)}
.spark .lt{fill:var(--faint);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
tr.sum td{font-weight:700;border-bottom:0}
input.name{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px}
.copy{border:0;background:none;color:var(--blue);font-size:12.5px;cursor:pointer;padding:0 0 0 6px}
.foot{color:var(--faint);font-size:12px;margin-top:32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.mv b,.mv i{animation:none}}
</style>
</head>
<body>
<header class="top wrap">

  <h1>도쿄 설날 여행</h1>
  <div class="stats">
    <div><b id="dday">D-</b><span id="dday-l">출발까지</span></div>
    <div><b id="fx">₩—</b><span>100엔</span></div>
    <div><b>2박</b><span>히키후네 숙소</span></div>
  </div>
</header>
<nav aria-label="탭"><div class="wrap" id="tabs" role="tablist"></div></nav>

"d0-6", "t": "08:35", "title": "TW241 인천 출발 → 나리타 T2 10:55", "txt": "보잉 737-800으로 2시간 20분 비행해요. 맑은 날에는 착륙 전 창밖으로 후지산이 보이기도 해요."}], "missions": [{"id": "m0-1", "what": "출국장에서 가족 첫 단체 사진 찍기"}]}, {"id": "d1", "tab": "DAY 1", "date": "2027-01-01", "dateLabel": "1/1 (금) · 설날", "title": "스카이트리 일몰 & 아사쿠사 밤 참배", "intro": "설날 첫날은 숙소 반경 3km 안에서만 움직여요. 스카이트리는 일몰 시간에 맞춰 올라가고, 센소지는 사람이 몰리는 낮을 피해 밤에 참배해요.", "sum": {"hl": ["350m에서 보는 후지산과 일몰 (16:38경)", "새해 첫 만찬", "밤의 센소지 참배와 오미쿠지", "아즈마바시 다리에서 스카이트리 야경"], "reserve": "스카이트리 15:30 (웹) · 모모 파라다이스 18:15 · 카페 뫼르소 20:40", "wear": "밤 1~3℃ · 장갑, 목도리, 핫팩 · 센소지에서 오래 서 있어요", "sun": "일출 06:51 · 일몰 16:38"}, "callout": {"cls": "warn", "html": "<b>1월 1일은 백화점과 동네 식당이 많이 쉬어요.<\/b> 소라마치 같은 쇼핑몰은 대부분 열어요. 로쿠린샤와 저녁 식당이 1/1에 영업하는지는 12월 중순에 꼭 확인하세요."}, "items": [{"id": "d1-1", "t": "10:55", "title": "나리타 T2 도착 · 입국심사 · 세관", "txt": "Visit Japan Web QR 하나로 입국심사와 세관을 함께 통과해요. 설날이라 짐 찾기까지 <b>40~60분<\/b>을 잡으세요. 가족 중 한 명은 짐을 기다리고, 한 명은 화장실과 ATM에 다녀오면 시간을 아낄 수 있어요.", "map": "Narita Airport Terminal 2"}, {"id": "d1-2", "t": "11:50", "title": "Suica 준비 → 게이세이 '액세스특급' 탑승", "move": "공항 지하 1층 '空港第2ビル(공항제2빌딩)'역", "txt": "<b>アクセス特急(액세스특급) 押上(오시아게)·浅草(아사쿠사) 방면<\/b>을 타면 갈아타지 않고 1시간이 안 걸려요. 지정석이 없어서 Suica를 찍고 바로 타면 돼요. 약 40분 간격이라 <b>11:50~12:30 사이에 오는 첫 열차<\/b>를 타요. 시간표를 미리 확인하고, 늦어지면 소라마치 쇼핑을 줄이세요. 놓치면 게이세이 본선 특급을 타고 <b>青砥(아오토)<\/b>에서 갈아타세요. <b>스카이라이너는 오시아게에 서지 않아요.<\/b>", "tags": [["cost", "1인 IC ¥1,162"]], "links": [["게이세이 시간표", "https://www.keisei.co.jp/"]]}, {"id": "d1-3", "t": "13:00", "title": "오시아게역 코인락커에 캐리어 보관", "move": "押上〈スカイツリー前〉(오시아게 스카이트리 앞)역 하차", "txt": "12:30 열차를 탔다면 13:30쯤 도착해요. 그만큼 점심과 쇼핑 시간을 줄이세요. 24인치 캐리어는 <b>대형 락커<\/b>(¥700 안팎)에 들어가요. 연휴에는 금방 차니 도착하자마자 맡기세요. 역 락커가 꽉 찼으면 소라마치 안의 락커를 찾거나 <b>ecbo cloak<\/b> 앱으로 근처 보관소를 예약하세요(캐리어 하루 ¥800).", "map": "押上駅 コインロッカー", "tags": [["photo", "락커 번호 사진 찍기"]]}, {"id": "d1-4", "t": "13:15", "title": "점심 · 로쿠린샤 소라마치점 (츠케멘)", "txt": "진한 돼지뼈·해산물 국물에 굵은 면을 찍어 먹는 츠케멘이에요. 츠케멘 ¥900, 특제 ¥1,200 정도예요. 다 먹으면 '스프와리'를 부탁해 남은 국물을 희석해 마셔 보세요. 28석(2인 테이블 위주)이라 2+2로 나눠 앉을 수 있어요. 카드·Suica·QR 결제가 돼요. <b>예약은 안 되고<\/b> 웨이팅은 30~60분이에요. 한 명이 줄을 서는 동안 나머지는 같은 층을 구경하세요. 줄이 너무 길면 30·31층 식당가로 가거나 오시아게의 <b>다케스에 도쿄 프리미엄<\/b>(타베로그 3.77, 도보 7분)으로 가세요.", "map": "六厘舎 東京ソラマチ店", "tags": [["chk-tag", "예약 불가"], ["chk-tag", "1/1 영업 확인"], ["cost", "¥1,000~2,000"]]}, {"id": "d1-5", "t": "14:20", "title": "소라마치 첫 세일 · 쇼핑 · 무료 전망", "txt": "<ul><li><b>후쿠부쿠로(복주머니)<\/b>: 설날에만 파는 랜덤 할인 봉투예요. 소라마치는 1/1부터 세일해요(2026년 기준).<\/li><li><b>리락쿠마스토어<\/b>: 스카이트리 디자인 한정 상품이 있어요.<\/li><li><b>30·31층<\/b>: 레스토랑층인데 무료로 전망을 볼 수 있어요.<\/li><li>오늘은 쇼핑 짐을 계속 들고 다녀야 하니 무거운 건 마지막 날 사세요.<\/li><\/ul>", "map": "東京ソラマチ"}, {"id": "d1-c1", "cafe": 1, "t": "15:00", "title": "디저트 · 도모 라쿠노 63℃ (젤라토)", "txt": "소라마치 4층의 <b>타베로그 3.69<\/b>, 아이스크림 백명점(2023·2026)이에요. 63℃에서 저온 살균한 군마산 우유로 만든 <b>밀크 젤라토<\/b>가 대표 메뉴이고, 말차 믹스 컵은 ¥600이에요. 포장 전문점이라 근처 테라스 좌석에서 먹어요. 앉아서 쉬고 싶으면 1층 <b>호리우치 가지쓰엔<\/b>(과일 파르페, 3.51)으로 가세요. 6층 <b>기온 쓰지리<\/b> 말차 소프트(3.58)도 있어요.", "map": "東毛酪農 63℃ 東京ソラマチ", "tags": [["cafe", "☕ 3.69 · 백명점"], ["cost", "약 ¥600"]]}, {"id": "d1-6", "t": "15:30", "title": "도쿄 스카이트리 · 일몰과 후지산", "txt": "<ul><li><b>350층 텐보데크<\/b>: 서남쪽 창가에 자리를 잡으면 맑은 1월에는 <b>후지산 실루엣<\/b>이 잘 보여요. 일몰은 <b>16:38경<\/b>이에요.<\/li><li><b>340층 유리 바닥<\/b>: 발밑으로 340m 아래가 보여요. 가족 점프샷 찍기 좋아요.<\/li><li><b>345층<\/b>: 공식 기념품 숍이 있어요.<\/li><li><b>450층 텐보회랑<\/b>은 선택이에요(콤보권 ¥3,000~). 나선형 유리 회랑을 걸어 올라가요.<\/li><li>노을 → 매직아워 → 야경까지 보고 16:55쯤 내려오세요.<\/li><\/ul>표는 <b>웹으로 미리<\/b> 사세요. 현장에서 사면 장당 ¥500이 더 붙어요.", "map": "Tokyo Skytree", "tags": [["res", "날짜지정권 (웹)"], ["cost", "1인 ¥1,800~"], ["photo", "유리 바닥 점프샷"], ["photo", "일몰 직후 창가 실루엣"]]}, {"id": "d1-7", "t": "17:00", "title": "짐 찾기 → 도부선 1정거장 → 숙소 체크인", "move": "押上(오시아게) 락커에서 짐 찾기 → 도부선 押上 → 曳舟(히키후네) 1정거장", "txt": "히키후네역에서 걸어서 7분이에요. 셀프 체크인 안내 메일(도어 코드)을 미리 캡처해 두세요. 짐만 두고 <b>방 사진<\/b>을 찍어 두세요. 나중에 파손 문의가 생기면 도움이 돼요.", "map": "4-12-5 Mukojima, Sumida City, Tokyo", "tags": [["cost", "1인 약 ¥160"]]}, {"id": "d1-8", "t": "17:40", "title": "도부선 히키후네 → 아사쿠사", "move": "曳舟 → 浅草(아사쿠사) 약 6분", "txt": "도부 아사쿠사역에서 가미나리몬 옆 모모 파라다이스까지 걸어서 약 5분이에요. 예약 시간 10분 전에 도착하세요.", "links": [["경로 보기", "https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=%E6%9B%B3%E8%88%9F%E9%A7%85&destination=%E3%83%A2%E3%83%BC%E3%83%A2%E3%83%BC%E3%83%91%E3%83%A9%E3%83%80%E3%82%A4%E3%82%B9%20%E6%B5%85%E8%8D%89%E9%9B%B7%E9%96%80%E5%BA%97"]]}, {"id": "d1-9", "t": "18:15", "title": "저녁 · 새해 첫 스키야키 (모모 파라다이스 가미나리몬점)", "txt": "<b>1인 한 끼 ¥5,000 안팎<\/b>으로 와규 스키야키와 샤부샤부를 먹을 수 있는 곳이에요. <b>모모 코스 ¥4,950<\/b>(고기·채소 무한리필), 국산소 코스는 ¥6,380이에요. 서비스료와 자릿세가 없어요. 가미나리몬 바로 옆 건물 4층이라 식사 뒤 센소지까지 걸어서 2분이에요. 웹이나 전화(050-1807-8915)로 예약할 수 있어요. 연말연시(12/30~1/2)에는 특별 영업시간으로 연다고 공지돼 있어요. 예약할 때 영업시간과 식사 시간 제한을 확인하세요. 카드·IC·QR 결제가 돼요. 몬자야키를 먹고 싶으면 <b>몬로<\/b>(아사쿠사 몬자 3.46, '연말연시 영업' 명시, 예약 가능, 1인 ¥3,000~4,000)로 가세요.", "map": "モーモーパラダイス 浅草雷門店", "tags": [["res", "예약 (웹·전화)"], ["chk-tag", "연휴 시간 확인"], ["cost", "모모 코스 ¥4,950 (국산소 ¥6,380은 선택)"]]}, {"id": "d1-10", "t": "19:55", "title": "센소지 야간 참배(하쓰모데)", "txt": "<ul><li>동선: <b>가미나리몬<\/b>(큰 빨간 등) → <b>나카미세<\/b>(250m 상점가) → <b>호조몬<\/b> → <b>본당<\/b> → 오른쪽 <b>오층탑<\/b> 순서예요.<\/li><li>참배 순서: 향로 연기를 몸에 끼얹고 → 새전함에 동전을 넣고 → 두 손을 모아 소원을 빌어요(센소지는 절이라 박수를 치지 않아요).<\/li><li><b>오미쿠지 ¥100<\/b>: 통을 흔들어 나온 번호의 서랍에서 운세 종이를 꺼내요. 센소지는 흉이 많이 나오기로 유명해요. 흉이 나오면 경내 줄에 묶고 오세요.<\/li><li>새해 기념 <b>오마모리(부적)<\/b>는 ¥500~1,000이에요.<\/li><li>밤에는 낮(줄 1~2시간)보다 훨씬 한산하고, 조명 켜진 호조몬과 오층탑이 예뻐요. 본당 문이 닫혀 있어도 앞에서 참배할 수 있어요.<\/li><li>노점: 아마자케(단술), 야키소바, 감자버터를 맛보세요.<\/li><\/ul>", "map": "Senso-ji", "tags": [["free", "무료"], ["photo", "조명 켜진 호조몬"], ["photo", "오층탑"]]}, {"id": "d1-c2", "cafe": 1, "t": "20:40", "title": "디저트 · 카페 뫼르소 (케이크)", "txt": "가미나리몬 바로 옆 건물 2~3층의 <b>타베로그 3.57<\/b> 케이크 카페예요. 수제 케이크가 약 20종이고, 창밖으로 <b>불 켜진 스카이트리<\/b>가 보여요. 연중무휴로 21:30까지 열어요(<b>주문 마감 21:00<\/b>). 1/1 영업은 예약할 때 확인하세요. 45석이고 예약할 수 있어요. 카드 결제가 돼요. 늦게까지 여는 대안으로는 <b>푸글렌 아사쿠사<\/b>(와플, 23시까지)가 있어요.", "map": "CAFE MEURSAULT 浅草", "tags": [["cafe", "☕ 3.57"], ["res", "예약 가능"], ["cost", "1인 ¥1,000~2,000"]]}, {"id": "d1-11", "t": "21:20", "title": "아즈마바시 다리 · 스카이트리 야경", "move": "카페 뫼르소에서 도보 약 5분", "txt": "강 건너로 <b>불 켜진 스카이트리<\/b>와 아사히 맥주 본사의 황금 오브제가 한 화면에 들어오는 아사쿠사 대표 야경 포인트예요. 다리 위 아사쿠사 쪽 끝에서 찍으면 가장 잘 나와요.", "map": "吾妻橋", "tags": [["free", "무료"], ["photo", "가족 야경 사진"]]}, {"id": "d1-12", "t": "21:35", "title": "도부선으로 숙소 복귀 · 편의점 장보기", "move": "浅草 → 曳舟 약 6분", "txt": "1/2 아침은 코메다 커피예요. 혹시 문을 닫았을 때를 대비해 편의점에서 <b>간단한 간식<\/b>(오니기리, 타마고 산도)을 사 두세요. 숙소 주방과 세탁기도 쓸 수 있어요."}], "planB": "<ul><li><b>특별한 만찬을 원하면<\/b>: <b>아사쿠사 이마한<\/b>(1895년 창업, 타베로그 3.62)은 1/1에도 영업해요(마지막 입장 18:30). 다만 1인 약 ¥10,600(₩9만)이라 이번 계획에서는 뺐어요.<\/li><li><b>더 싸게 먹으려면<\/b><ul><li><b>몬로<\/b>(아사쿠사 몬자·오코노미야키, 3.46): '연말연시 영업'을 명시했고 83석, 예약 가능해요. 몬자 ¥1,078~2,948, 1인 ¥3,000~4,000, 자릿세 ¥440이 붙어요.<\/li><li><b>타지마야 ROX<\/b>(샤부샤부·스키야키 무한리필): 4인 테이블 19개, 예약 가능해요. 와규 무한리필 ¥3,980이 가장 인기예요.<\/li><\/ul><\/li><li><b>비가 오면<\/b>: 스카이트리는 날씨와 상관없이 올라가고(후지산은 포기), 센소지는 짧게 보고 아사쿠사 지하상가나 숙소에서 쉬어요.<\/li><li><b>입국이 늦어지면<\/b>: 점심을 소라마치 식당가로 바꾸고 스카이트리 시간을 지키세요(일몰이 이 날의 핵심이에요).<\/li><\/ul>", "missions": [{"id": "m1-1", "what": "340층 유리 바닥에서 가족 점프샷"}, {"id": "m1-2", "what": "오미쿠지 4명 결과 비교 · 가장 좋은 운세 1등"}, {"id": "m1-3", "what": "각자 새해 소원을 종이에 적어 들고 사진 찍기"}]}, {"id": "d2", "tab": "DAY 2", "date": "2027-01-02", "dateLabel": "1/2 (토)", "title": "황궁 · 근대미술관 · 시부야 · 신주쿠", "intro": "아침은 아사쿠사 코메다 모닝으로 시작해서, 동쪽(황궁·미술관)에서 서쪽(신주쿠)으로 한 방향으로만 움직여요. 시부야 스카이는 일몰에 맞췄어요.", "sum": {"hl": ["1년에 하루, 천황 일가의 새해 인사", "닌텐도·포켓몬센터", "시부야 스카이 일몰과 스크램블 교차로", "신주쿠 3D 고양이와 고질라"], "reserve": "시부야 스카이 16:00 · 토리엔 19:15 · 치이카와 베이커리 15:00 (선택)", "wear": "많이 걸어요(1만 5천 보 이상) · 편한 신발 · 옥상용 장갑과 귀마개", "sun": "일출 06:51 · 일몰 16:39"}, "callout": {"cls": "warn", "html": "<b>1/2는 메이지신궁 참배객 때문에 하라주쿠역 일대가 아주 붐벼요.<\/b> 다케시타도리는 피하고, 시부야에서 <b>캣스트리트<\/b>로 걸어가세요. 저녁은 연초에도 여는 큰 야키토리집(토리엔)으로 잡았어요."}, "items": [{"id": "d2-1", "t": "07:30", "title": "숙소 출발 → 아사쿠사", "txt": "큰 가방은 숙소에 두고 가세요. 황궁에는 보안검사가 있어요. 도부선으로 히키후네에서 아사쿠사까지 6분 가요. 시부야 스카이 옥상은 추우니 장갑을 챙기세요.", "tags": [["cost", "1인 약 ¥160"]]}, {"id": "d2-c0", "cafe": 1, "t": "08:00", "title": "아침 · 코메다 커피 다와라마치역앞점 (모닝)", "move": "도부 아사쿠사역 → 다와라마치 쪽 도보 12분", "txt": "나고야식 체인 카페예요. 오전 11시까지는 <b>음료만 시켜도 토스트와 삶은 달걀(또는 팥) 모닝 세트가 무료<\/b>로 나와요. 매일 7:00에 열고 APA 호텔 1층에 있어요. 두꺼운 빵 위에 소프트크림을 올린 '시로노와르'는 4명이 나눠 먹기 좋아요. 정월 영업 여부는 미확인이니, 문을 닫았으면 근처 편의점이나 아사쿠사역 앞 맥도날드로 가세요.", "map": "コメダ珈琲店 田原町駅前店", "tags": [["cafe", "☕ 체인 · 모닝 무료"], ["chk-tag", "정월 영업 확인"], ["cost", "1인 약 ¥600"]]}, {"id": "d2-2", "t": "08:45", "title": "다와라마치 → 오테마치", "move": "긴자선 다와라마치 → 미쓰코시마에, 한조몬선 환승 → 오테마치 약 20분", "txt": "오테마치역에서 황거외원까지 걸어서 10~15분이에요. 사람이 많으니 안내원의 지시를 따르세요. 보안검사 줄이 1시간 넘게 걸릴 수 있으니 <b>오테마치역에서 화장실에 꼭 들르세요<\/b>."}, {"id": "d2-3", "t": "09:20", "title": "황궁 신년 일반참하 (선택)", "txt": "<ul><li>1년에 딱 하루, <b>천황 일가가 궁전 발코니에 나와 새해 인사<\/b>를 해요.<\/li><li>동선: 황거외원에 모여 → 보안검사 → <b>니주바시(이중교)<\/b>를 건너 궁 안으로 → 궁전 앞마당에서 인사를 들어요.<\/li><li>입구에서 작은 <b>일장기<\/b>를 나눠 줘요. 기념품으로 가져오세요.<\/li><li>2026년에는 9:30~14:10 입장에 5번 나왔어요. 2027년 시간은 12월 궁내청 발표를 확인하세요.<\/li><li>황궁 동쪽 정원(히가시교엔)은 연말연시에 문을 닫아요.<\/li><\/ul>나갈 때는 <b>이누이몬(乾門)<\/b> 쪽 출구로 나가면 다음 일정인 근대미술관이 바로 앞이에요(출구 지정은 당일 안내를 따르세요).", "map": "皇居 二重橋", "tags": [["free", "무료"], ["chk-tag", "시간 발표 확인"], ["photo", "니주바시 앞"]], "links": [["궁내청", "https://www.kunaicho.go.jp/"]]}, {"id": "d2-4", "t": "11:20", "title": "도쿄국립근대미술관 (MOMAT)", "move": "황궁 출구 → 이누이몬·기타노마루 공원 쪽 도보 약 25~30분", "txt": "황궁 바로 옆, 일본 근현대 미술 컬렉션이 가장 큰 국립미술관이에요. 연말연시에는 12/28~1/1에 쉬고 <b>1/2에 다시 열어요<\/b>. 1/2는 토요일이라 20:00까지 열어요. 1월에는 <b>다케히사 유메지 특별전<\/b>(~1/11, 일반 약 ¥2,100)과 소장품전을 해요. 40~50분쯤 보고 나와요. 4층 '눈 쉬는 방'에서는 황궁 숲이 내려다보여요. 도쿄역 쪽이 더 좋으면 <b>미쓰비시 이치고칸 미술관<\/b>(1/2 영업, 10:00~18:00, 퐁타네지전 ¥2,300)으로 바꿀 수 있어요. 아티존·네즈 미술관은 1/4까지, 국립신미술관은 1/5까지 쉬어요.", "map": "東京国立近代美術館", "tags": [["cost", "특별전 약 ¥2,100 · 소장품전 별도"], ["free", "1/2 재개관"]], "links": [["MOMAT 공식", "https://www.momat.go.jp/"]]}, {"id": "d2-4b", "t": "12:15", "title": "다케바시 → 시부야", "move": "도자이선 다케바시 → 구단시타(1정거장), 한조몬선 환승 → 시부야 약 25분", "txt": "다케바시역 1b 출구가 미술관 바로 앞이에요. 구단시타에서 한조몬선으로 갈아타면 시부야까지 바로 가요."}, {"id": "d2-5", "t": "13:00", "title": "점심 · 스파게티 판초 시부야점 (나폴리탄)", "txt": "일본식 케첩 스파게티 <b>나폴리탄<\/b> 전문점이에요. 보통 사이즈가 ¥980 정도예요(2025년 인상). 토핑으로 달걀프라이나 치즈를 올려 보세요. 도겐자카의 지하 1층이고 11:00~23:00에 열며 연중무휴라고 돼 있어요. 카드 결제가 돼요. 예약은 안 되지만 회전이 빨라요. 숯불 함박을 원하면 <b>히키니쿠토코메<\/b>(TableCheck 예약, 1인 약 ¥2,980)로 바꾸세요.", "map": "スパゲッティーのパンチョ 渋谷店", "tags": [["cost", "1인 약 ¥1,000~1,500"], ["chk-tag", "정월 영업 확인"]]}, {"id": "d2-6", "t": "14:00", "title": "시부야 파르코 6층 · 미야시타 파크", "txt": "<ul><li><b>시부야 파르코 6층<\/b>에 <b>닌텐도 도쿄<\/b>, <b>포켓몬센터 시부야<\/b>, 캡콤 스토어, 점프 숍이 다 모여 있어요. 파르코의 1/2 영업 여부는 확인하세요.<\/li><li><b>미야시타 파크<\/b>는 옥상 공원이라 무료로 쉬어 갈 수 있어요.<\/li><\/ul> 파르코가 닫았으면 스크램블 스퀘어나 미야시타 파크 쇼핑으로 바꾸세요.", "map": "渋谷PARCO", "tags": [["chk-tag", "1/2 영업 확인"]]}, {"id": "d2-7", "t": "14:25", "title": "캣스트리트 → 오모테산도 · 하라주쿠", "move": "시부야 → 하라주쿠 도보 15~20분", "txt": "<ul><li><b>캣스트리트<\/b>: 차가 안 다니는 뒷골목이라 편집숍과 카페를 구경하며 걷기 좋아요.<\/li><li><b>치이카와 베이커리<\/b>(오모카도 3층): <b>15:00 전후 슬롯<\/b>으로 예약하세요. 예약을 못 했으면 당일 14:50쯤 공식 X에 올라오는 15시 이후 입장용 디지털 번호표(정리권)를 노리세요.<\/li><li><b>키디랜드<\/b>: 치이카와랜드, 리락쿠마, 헬로키티가 한 건물에 있어요.<\/li><li><b>오모카도 옥상 테라스<\/b>는 무료예요. 오모테산도 거리를 내려다보며 쉬어 가세요.<\/li><\/ul>", "map": "キデイランド原宿店", "tags": [["res", "베이커리 예약"], ["photo", "오모카도 거울 입구"]]}, {"id": "d2-8", "t": "15:40", "title": "하라주쿠 → 시부야", "move": "JR 原宿(하라주쿠) → 渋谷 2분", "txt": "시부야 스크램블 스퀘어 14층 입장구로 가세요. 슬롯 시작 10분 전에는 도착해야 해요. 옥상에는 가방을 가지고 갈 수 없어서 <b>코인락커(¥100, 나중에 돌려받음)<\/b>에 넣어야 해요."}, {"id": "d2-9", "t": "16:00", "title": "시부야 스카이 · 일몰", "txt": "<ul><li>229m 옥상 <b>스카이 스테이지<\/b>에서 360°를 봐요. 서쪽으로 <b>후지산과 노을<\/b>, 발아래로 <b>스크램블 교차로<\/b>가 보여요.<\/li><li>일몰은 <b>16:39<\/b>예요. 해가 진 뒤 20분 동안이 가장 예뻐요.<\/li><li>대표 포토존 <b>스카이 엣지<\/b>(유리 모서리)는 줄을 서요. 일몰 전에 미리 찍으세요.<\/li><li>모자처럼 날아갈 수 있는 물건은 반입이 안 돼요. 휴대폰은 스트랩이 있으면 가지고 갈 수 있어요.<\/li><li>실내 46층 <b>스카이 갤러리<\/b>에서 몸을 녹이세요.<\/li><\/ul>", "map": "SHIBUYA SKY", "tags": [["res", "예약 필수 (웹 ¥3,400)"], ["photo", "스카이 엣지 가족사진"]]}, {"id": "d2-10", "t": "17:20", "title": "스크램블 교차로 · 하치코 동상", "txt": "위에서 내려다본 교차로를 이번엔 직접 건너요. 신호가 바뀌면 한 번에 수천 명이 건너요. <b>영상으로 찍으세요.<\/b> 하치코 동상 앞은 줄이 있어요. <b>긴자 웨스트<\/b>의 리프파이는 티룸이 연휴에 쉬어서, 시부야역 도요코 노렌가이 판매 코너(2025-26년 기준 1/2 10:00~19:00)에서 사세요. 12장 ¥2,160이에요.", "map": "Shibuya Scramble Crossing", "tags": [["photo", "교차로 건너는 영상"]]}, {"id": "d2-c2", "cafe": 1, "t": "17:35", "title": "디저트 · 니시무라 후르츠팔러 도겐자카점", "txt": "스크램블 교차로를 건너 바로 있는 2층 과일 파르페 집이에요. <b>타베로그 3.69<\/b>, 스위츠 백명점(2026)이에요. <b>연초 영업이 공지로 확인됐어요(1/2~1/3 11:00~20:00).<\/b> 124석이라 4명이 앉기 쉽고 카드·IC·QR 결제가 돼요. 제철 과일 파르페를 시키고, 교차로를 내려다보며 쉬어 가세요.", "map": "渋谷西村フルーツパーラー 道玄坂店", "tags": [["cafe", "☕ 3.69 · 백명점"], ["free", "연초 영업 확인"], ["cost", "1인 ¥1,500~2,500"]]}, {"id": "d2-11", "t": "18:20", "title": "시부야 → 신주쿠 · 3D 고양이 · (선택) 마지컬 치이카와", "move": "JR 야마노테선 渋谷 → 新宿(신주쿠) 7분 · 동쪽 출구", "txt": "<ul><li><b>3D 고양이 전광판<\/b>(크로스 신주쿠 비전): 동쪽 출구 광장에서 거대한 고양이가 화면 밖으로 튀어나오는 것처럼 보여요.<\/li><li><b>마지컬 치이카와 스토어<\/b>(신주쿠 마루이): 스핀오프 한정 굿즈를 팔아요.<\/li><\/ul>", "map": "クロス新宿ビジョン", "tags": [["free", "무료"], ["photo", "3D 고양이"]]}, {"id": "d2-12", "t": "19:15", "title": "저녁 · 토리엔 (오모이데요코초 야키토리)", "txt": "쇼와 시대 골목 <b>오모이데요코초<\/b> 분위기를 그대로 즐기면서 4명이 함께 앉을 수 있는 큰 야키토리집이에요. <b>197석<\/b>에 4인 개별실이 있고 <b>예약할 수 있어요<\/b>. <b>12/31만 휴무<\/b>라 1/2에는 열 가능성이 높아요. 1인 ¥3,000~5,000에 오토시(자릿세) ¥330이 붙고, 카드·IC·QR 결제가 돼요. 꼬치 모둠과 쓰쿠네를 시켜 보세요. 혹시 닫았으면 신주쿠역 루미네·오다큐 식당가로 가세요.", "map": "鳥園 新宿 思い出横丁", "tags": [["res", "예약 가능"], ["chk-tag", "1/2 영업 확인"], ["cost", "1인 ¥3,000~5,000"]]}, {"id": "d2-13", "t": "20:50", "title": "가부키초 고질라 → 귀가", "move": "JR 소부선 新宿 → 錦糸町(긴시초) → 한조몬선 직통 → 曳舟 약 40분", "txt": "신주쿠 도호빌딩 위 <b>고질라 헤드<\/b>를 보고 가요. 울음소리·조명 연출은 정시에 있고 밤 8시 무렵이 마지막이라 못 볼 수도 있어요. 그래도 헤드 사진은 찍을 수 있어요. 가부키초는 큰길로만 다니고, 호객하는 사람은 무시하세요. 1/3 아침을 위해 일찍 들어가세요. 들어가는 길에 히키후네 편의점에서 <b>1/3 아침거리<\/b>(오니기리, 요구르트)를 사 두세요.", "links": [["경로 보기", "https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=%E6%96%B0%E5%AE%BF%E9%A7%85&destination=%E6%9B%B3%E8%88%9F%E9%A7%85"]], "tags": [["photo", "고질라 헤드"]]}], "planB": "<ul><li><b>늦잠 버전<\/b>: 황궁을 빼고 10:30 시부야 도착 → 파르코와 하라주쿠를 여유 있게 → 14:30쯤 시부야 스카이에 입장해요. 15시 전 입장권(¥2,700)으로 일몰까지 있으면 4명이 ¥2,800을 아껴요.<\/li><li><b>비가 오면<\/b>: 시부야 스카이 옥상이 닫힐 수 있어요(실내는 열고 입장료 일부 조정 여부는 현장 안내 확인). 캣스트리트 대신 지하철로 메이지진구마에역까지 가세요.<\/li><li><b>너무 지치면<\/b>: 신주쿠 저녁을 빼고 시부야에서 먹은 뒤 한조몬선 직통으로 바로 숙소로 가세요(갈아타기 없음).<\/li><\/ul>", "missions": [{"id": "m2-1", "what": "황궁에서 받은 일장기 들고 가족사진"}, {"id": "m2-2", "what": "편의점 ¥1,000 챌린지: 각자 ¥1,000으로 최고의 간식을 사서 투표"}, {"id": "m2-3", "what": "스크램블 교차로 가족 영상"}]}, {"id": "d3", "tab": "DAY 3", "date": "2027-01-03", "dateLabel": "1/3 (일)", "title": "오전 팀랩 또는 미술관 · 낮의 아사쿠사 · 귀국", "intro": "오전은 팀랩 플래닛(A안)과 국립서양미술관(B안) 중에 골라요. 짐은 오시아게에 맡기고, 마지막에는 강변을 걸어 오시아게로 돌아가 공항으로 바로 가요.", "sum": {"hl": ["팀랩: 물속을 걷는 빛의 전시", "낮의 가미나리몬 가족사진", "스미다 리버워크 산책", "면세 환급 후 출국"], "reserve": "A안 팀랩 10:30 / B안 터너전(예매 방식 확인) · 에어서울 온라인 체크인 · (권장) ecbo cloak 짐 보관", "wear": "팀랩용으로 걷어 올릴 수 있는 바지(무릎까지 물) · 치마는 피하기", "sun": "일출 06:51 · 일몰 16:39"}, "callout": {"cls": "alert", "html": "<b>귀국편은 나리타 T1(에어서울)<\/b>이에요. 액세스특급의 종점 '成田空港(나리타공항)'역이 T1이에요. 면세품은 <b>보안검사 전, 짐을 부치기 전에<\/b> 4층 세관 키오스크에서 확인을 받아야 하니 꺼내기 쉬운 가방에 따로 담아 두세요."}, "items": [{"id": "d3-1", "t": "07:30", "title": "짐 싸기 · 분실물 체크", "txt": "충전기, 욕실, 냉장고, 금고를 확인하세요. <b>면세품 봉투와 영수증은 따로<\/b> 챙기세요. 쓰레기는 숙소 안내대로 분리해서 버려요."}, {"id": "d3-2", "cafe": 1, "t": "08:15", "title": "무코지마 아침 산책 · 조메이지 사쿠라모치", "txt": "숙소에서 강 쪽으로 12분 걸어가요. <b>조메이지 사쿠라모치<\/b>(타베로그 3.74, 화과자 백명점)는 1717년부터 소금에 절인 벚잎으로 싼 사쿠라모치를 팔아 온 가게예요. 1개 ¥250이고 일요일은 <b>8:30<\/b>에 열며 가게 안에서 먹을 수 있어요(20석). 가는 길에 미메구리 신사(스미다강 칠복신)에 들르고, 9시 전에 숙소로 돌아와 체크아웃하세요. 더 이른 시간엔 <b>가메팡<\/b>(빵집 3.55, 일요일 7:30 오픈)도 있어요.", "map": "長命寺 桜もち", "tags": [["cafe", "☕ 3.74 · 백명점"], ["cost", "1개 ¥250"], ["chk-tag", "정월 영업 확인"]]}, {"id": "d3-3", "t": "09:00", "title": "체크아웃 → 오시아게 코인락커", "move": "曳舟 → 押上 1정거장", "txt": "정규 체크아웃 10:00보다 1시간 일찍 나와요. 첫날 쓴 락커 자리로 가면 헤매지 않아요. 무거운 쇼핑 짐도 같이 맡기세요. 연휴라 락커가 찰 수 있으니 <b>ecbo cloak<\/b>으로 오시아게·소라마치 짐 보관을 미리 예약해 두면 안심이에요.", "tags": [["photo", "락커 번호 사진"]]}, {"id": "d3-b4", "opt": "b", "t": "09:15", "title": "오시아게 → 우에노", "move": "도에이 아사쿠사선 押上 → 浅草, 긴자선 환승 → 上野(우에노) 약 25분", "txt": "우에노역에서 미술관까지는 공원 출구로 나가 걸어서 약 5분이에요."}, {"id": "d3-4", "t": "09:30", "title": "오시아게 → 도요스", "move": "한조몬선 → 清澄白河(기요스미시라카와) → 오에도선 → 月島(쓰키시마) → 유라쿠초선 → 豊洲(도요스), 약 40분", "txt": "도요스역에서 팀랩까지 걸어서 약 10분이에요. 유리카모메 신토요스역에서 내리면 1분이에요. 구글맵이 보여 주는 가장 빠른 경로를 따르세요.", "links": [["경로 보기", "https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=%E6%8A%BC%E4%B8%8A%E9%A7%85&destination=teamLab%20Planets%20TOKYO"]], "opt": "a"}, {"id": "d3-b5", "opt": "b", "t": "09:45", "title": "국립서양미술관 · 터너전", "map": "国立西洋美術館", "txt": "<ul><li><b>건물<\/b>: 르코르뷔지에 설계, 2016년 유네스코 세계유산<\/li><li><b>앞마당(무료)<\/b>: 로댕 '생각하는 사람', '지옥의 문', '칼레의 시민'<\/li><li><b>상설전<\/b>: 모네 '수련', 고흐 '장미', 르누아르 등 마쓰카타 컬렉션<\/li><li><b>특별전<\/b>: 테이트 미술관 <b>터너전<\/b>(~2027/2/21) · 일반 ¥2,400<\/li><\/ul>9:30에 열고 1/2부터 영업해요. 시간 지정 예매가 필요한지는 전시 공식 사이트에서 확인하세요. 약 2시간 보고 나와요.", "tags": [["cost", "터너전 1인 ¥2,400"], ["chk-tag", "예매 방식 확인"], ["photo", "생각하는 사람 앞"]], "links": [["터너전 공식", "https://turner2026-27.exhibit.jp/"]]}, {"id": "d3-5", "t": "10:30", "title": "팀랩 플래닛 도쿄 (도요스)", "txt": "<ul><li><b>맨발<\/b>로 들어가요. 무료 락커에 신발과 짐을 넣고, 반바지는 무료로 빌릴 수 있어요.<\/li><li>대표 전시: 무릎까지 오는 물속에서 빛나는 잉어가 헤엄치는 방, 무한히 반사되는 빛의 방, 머리 위로 꽃이 떠다니는 <b>플로팅 플라워 가든<\/b>, 거대한 공이 굴러다니는 방이 있어요.<\/li><li>바닥이 거울인 방이 있어서 <b>치마는 피하세요.<\/b><\/li><li>예약 시간에 가도 입장까지 0~30분 기다려요(연말연시는 더 길 수 있어요). 관람은 약 1.5시간이면 충분해요. <b>12:40에는 나오세요.<\/b><\/li><\/ul>", "map": "teamLab Planets TOKYO", "tags": [["res", "시간 지정 (가격 날짜별 변동)"], ["cost", "1인 ¥3,600~"], ["photo", "플로팅 플라워 가든"]], "opt": "a"}, {"id": "d3-b6", "opt": "b", "t": "11:50", "title": "우에노 공원 · 시노바즈 연못 산책", "map": "不忍池", "txt": "미술관 앞 공원 길을 따라 시노바즈 연못까지 천천히 걸어요. 연못 가운데 벤텐도(작은 사당)까지 다리로 건너갈 수 있어요. 정월이라 노점이 서 있을 수 있어요. 시간이 남으면 우에노역 옆 <b>아메요코<\/b> 시장 골목을 구경하세요.", "tags": [["free", "무료"]]}, {"id": "d3-b7", "opt": "b", "t": "12:40", "title": "우에노 → 아사쿠사", "move": "긴자선 上野 → 浅草 약 5분", "txt": "아사쿠사역 1번 출구로 나가면 가미나리몬이 바로 앞이에요."}, {"id": "d3-6", "t": "13:00", "title": "도요스 → 아사쿠사", "move": "유라쿠초선 → 긴자선 환승, 약 40분", "txt": "긴자선 아사쿠사역 1번 출구로 나가면 가미나리몬이 바로 앞이에요.", "links": [["경로 보기", "https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=%E8%B1%8A%E6%B4%B2%E9%A7%85&destination=%E6%B5%85%E8%8D%89%E9%A7%85"]], "opt": "a"}, {"id": "d3-b8", "opt": "b", "t": "13:00", "title": "점심 · 요시카미 (아사쿠사 양식 노포)", "map": "ヨシカミ 浅草", "txt": "1951년에 문을 연 양식집이에요. <b>49석<\/b>이라 4명이 앉기 쉬워요. 하야시라이스, 오므라이스, 비프스튜가 대표 메뉴예요. 카드·Suica를 쓸 수 있고, 정기휴무는 수·목이에요. B안은 점심이 40분 빨라서 줄이 짧을 때 들어갈 수 있어요.", "tags": [["chk-tag", "예약 불가"], ["cost", "1인 ¥2,000~4,000"]]}, {"id": "d3-7", "t": "13:40", "title": "점심 · 요시카미 (아사쿠사 양식 노포)", "txt": "<b>요시카미<\/b>(타베로그 3.71)는 1951년에 문을 연 양식집으로 <b>49석<\/b>이라 4명이 앉기 쉬워요. 하야시라이스, 오므라이스, 비프스튜가 대표 메뉴예요. 카드·Suica를 쓸 수 있어요. 예약은 안 되고, 정기휴무는 수·목이라 1/3(일)은 열 가능성이 높아요. 라멘이 당기면 <b>주카소바 비리켄<\/b>(츠케멘 3.74, 정기휴무 없음, 현금)으로 가세요. 줄이 길어서 <b>13:55까지 못 앉으면<\/b> 아사쿠사역 앞 CoCo이치방야(카레)로 바꾸세요.", "map": "ヨシカミ 浅草", "tags": [["chk-tag", "예약 불가"], ["chk-tag", "1/3 영업 확인"], ["cost", "1인 ¥2,000~4,000"]], "opt": "a"}, {"id": "d3-b9", "opt": "b", "cafe": 1, "t": "13:50", "title": "커피 · 로얄 커피 본점 (ローヤル珈琲店)", "map": "ローヤル珈琲店 浅草", "txt": "요시카미 바로 옆 덴보인도리의 <b>타베로그 3.68<\/b> 노포 킷사텐이에요. 사이펀 커피와 홈메이드 케이크·푸딩을 맛보세요. B안은 시간이 넉넉해서 30분 쉬어 갈 수 있어요. 정월 영업은 전화(03-3844-3012)로 확인하세요.", "tags": [["cafe", "☕ 3.68"], ["cost", "1인 약 ¥1,000~1,800"]]}, {"id": "d3-8", "t": "14:30", "title": "낮의 가미나리몬 · 나카미세 간식 투어", "txt": "<ul><li><b>가미나리몬 큰 등 아래<\/b>에서 가족사진을 찍으세요. 사람이 많으면 등 바로 아래에서 위를 올려다보며 찍어도 좋아요.<\/li><li>나카미세 간식: <b>가게쓰도<\/b> 점보 멜론빵 ¥320(3.57, 1/1에도 영업, 현금), <b>아즈마<\/b> 키비당고 5개 ¥300~450(3.56, 현금), 닌교야키 8개 ¥600, 아게만주 1개 약 ¥250이에요. <b>동전을 넉넉히<\/b> 챙기세요.<\/li><li>기내 간식으로는 <b>가메주<\/b> 도라야키 ¥430(3.79, 포장, 현금, 줄 있음)를 사 가세요.<\/li><li>나카미세는 <b>걸으면서 먹지 않는 게<\/b> 예절이에요. 가게 앞에서 먹고 이동하세요.<\/li><\/ul>", "map": "Kaminarimon", "tags": [["photo", "가미나리몬 가족사진"]]}, {"id": "d3-9", "t": "15:05", "title": "드럭스토어 · 돈키호테 쇼핑", "txt": "이브(EVE), 루루어택, 휴족시간, 메구리즘을 사요. <b>돈키호테 쿠폰은 실시간 화면<\/b>으로 보여 줘야 해요(꿀팁 탭 참고). 면세 환급을 받으려면 <b>여권 실물<\/b>을 꼭 가져가세요. 같은 가게에서 ¥5,000 이상이면 면세 대상이에요.", "map": "ドン・キホーテ 浅草店", "tags": [["photo", "영수증 보관"]]}, {"id": "d3-10", "t": "15:35", "title": "스미다 리버워크로 오시아게까지 걷기", "move": "아사쿠사 → 리버워크 → 도쿄 미즈마치 → 오시아게, 도보 약 30~35분", "txt": "철교 옆 보행로로 스미다강을 건너요. 가까워지는 스카이트리를 보며 걷는 <b>여행 마지막 산책<\/b>이에요. 짐이 무겁거나 시간이 빠듯하면 도에이 아사쿠사선(1정거장)을 타세요.", "map": "すみだリバーウォーク", "tags": [["free", "무료"], ["photo", "강 위에서 스카이트리"]]}, {"id": "d3-11", "t": "16:10", "title": "오시아게 · 짐 찾기 · 재정리", "txt": "쇼핑 짐을 캐리어에 옮겨 담아요. <b>15kg<\/b>을 넘을 것 같으면 접이식 보스턴백을 꺼내세요. <b>면세품은 꺼내기 쉬운 가방<\/b>에 따로 넣어 두세요."}, {"id": "d3-12", "t": "16:25", "title": "액세스특급 오시아게 → 나리타공항(T1)", "move": "押上 → 成田空港 약 1시간", "txt": "<b>16:20~16:30 무렵 출발하는 '成田空港(나리타공항)'행<\/b>을 타요(1/3 시간표를 미리 확인하세요). 종점에서 내리면 돼요. 놓쳐도 다음 열차로 충분해요.", "tags": [["cost", "1인 IC ¥1,162"]]}, {"id": "d3-13", "t": "17:30", "title": "나리타 T1 · 면세 환급 → 에어서울 체크인", "txt": "<ol style='margin:4px 0 0;padding-left:18px'><li><b>4층 세관 환급 키오스크<\/b>에서 여권과 면세품을 확인받아요. 와이파이는 <span class='mono'>Customs_WiFi_For_TaxRefund<\/span> / <span class='mono'>jcustoms<\/span>예요.<\/li><li>현금으로 받으려면 'Self Tax Refund' 카운터로 가세요.<\/li><li>그다음 에어서울 카운터에서 짐을 부쳐요(LCC는 보통 출발 50~60분 전 마감).<\/li><\/ol>", "map": "Narita Airport Terminal 1", "tags": [["chk-tag", "면세 환급"]]}, {"id": "d3-14", "t": "18:00", "title": "공항 저녁 (18:00~18:35) · 남은 엔화 쓰기", "txt": "T1 센트럴빌딩 4~5층 식당가에서 먹어요. 장어덮밥 <b>카와토요<\/b>(3.61)는 나리타 명물이고, <b>토미타 멘탄<\/b>은 츠케멘이에요. 4명이 확실히 앉으려면 <b>게이세이 유젠<\/b>(일식, 135석, 예약 가능, ¥2,000~3,000)으로 가세요. 디저트는 4층 <b>고디바 카페<\/b>(공항 한정 말차 메뉴, 보안검사 전)가 있어요. 보안검사를 통과한 뒤에는 선택지가 적어요. 남은 동전은 편의점에서 다 쓰세요."}, {"id": "d3-15", "t": "18:40", "title": "보안검사 · 출국심사 · 탑승", "txt": "1/3은 연휴 마지막 날이라 출국심사 줄이 길 수 있어요. 탑승은 보통 출발 40분 전에 시작해요."}, {"id": "d3-16", "t": "20:00", "title": "RS268 나리타 출발 → 인천 T2 22:30", "txt": "에어버스 A321로 2시간 30분 비행해요. 기내에서 이번 여행 '베스트 순간'을 한 명씩 말해 보세요."}, {"id": "d3-17", "t": "22:30", "title": "인천 T2 도착 → T1 장기주차장 → 귀가", "txt": "차는 T1 쪽에 있어요. <b>터미널 간 무료 셔틀<\/b>(T2→T1 약 15~20분)이나 <b>공항철도<\/b>(T2→T1 1정거장, 약 6분)로 이동한 뒤 장기주차장 셔틀을 타세요. 막차 시간을 미리 확인하고, 정산할 때 저공해차 감면이 적용됐는지 보세요.", "tags": [["chk-tag", "셔틀 막차 확인"]]}], "planB": "<ul><li><b>팀랩 대기가 너무 길면<\/b>: 옆 건물 <b>도요스 센캬쿠반라이<\/b>(에도 거리 분위기의 푸드홀, 옥상 족욕 전망)에서 시간을 보내요. 연휴 영업은 확인하세요.<\/li><li><b>비가 오면<\/b>: 리버워크 대신 도에이 아사쿠사선으로 이동하고, 쇼핑은 오시아게 소라마치에서 마무리해요.<\/li><li><b>공항에 일찍 가고 싶으면<\/b>: 한 대 앞 액세스특급(약 40분 전)을 타세요. 면세 환급 줄이 길 수 있어요.<\/li><li><b>아사쿠사에서 빨리 한 끼<\/b>: CoCo이치방야 도부아사쿠사역앞점(카레, 11:00~23:00). 체인이라 연휴에도 열 가능성이 높아요.<\/li><li><b>커피 한잔 더<\/b>: 아사쿠사 덴보인도리의 <b>로얄 커피 본점<\/b>(킷사텐, 타베로그 3.68, 8:00~19:00). 공항에 한 대 늦게 가도 될 때 들르세요.<\/li><\/ul>", "missions": [{"id": "m3-1", "what": "팀랩 꽃 정원에서 4명 누워서 찍기"}, {"id": "m3-2", "what": "나카미세 간식 순위 매기기"}, {"id": "m3-3", "what": "비행기에서 '이번 여행 베스트 순간' 한 명씩 말하기"}], "options": {"key": "d3-opt-museum", "a": {"label": "A안 · 팀랩 플래닛", "sub": "물속을 걷는 디지털 아트 · 도요스", "desc": "<b>무엇을 하나요?<\/b> 신발을 벗고 맨발로 들어가는 체험형 디지털 아트 전시예요. 무릎까지 오는 물속을 걸으면 발밑에서 빛나는 잉어가 헤엄치고, 거울로 끝없이 이어지는 빛의 방, 머리 위로 꽃이 떠다니는 방, 커다란 공이 굴러다니는 방을 차례로 지나가요. 작품이 사람 움직임에 반응해서 계속 바뀌어요.<br><b>이런 가족에게<\/b>: 사진·영상을 많이 남기고 싶을 때, 몸으로 즐기는 걸 좋아할 때<br><b>시간·비용<\/b>: 대기 포함 약 2시간 · 1인 ¥3,600~(날짜별 변동, 예약 필수)<br><b>준비<\/b>: 걷어 올릴 수 있는 바지, 치마는 피하기"}, "b": {"label": "B안 · 국립서양미술관", "sub": "모네·고흐·로댕 + 터너전 · 우에노", "desc": "<b>무엇을 하나요?<\/b> 르코르뷔지에가 설계해서 <b>건물 자체가 유네스코 세계유산<\/b>인 미술관이에요. 상설전에서는 모네의 '수련', 고흐, 르누아르 같은 인상파 그림을 보고, 앞마당에서는 로댕의 <b>'생각하는 사람'<\/b>과 '지옥의 문'(무료)을 봐요. 1월에는 영국 테이트 미술관의 <b>터너전<\/b>(빛과 바다를 그린 영국 풍경화의 거장, ~2/21)을 해요. 관람 뒤에는 우에노 공원과 시노바즈 연못을 산책해요.<br><b>이런 가족에게<\/b>: 조용히 그림을 보고 싶을 때, 오전을 여유 있게 보내고 싶을 때(이동이 짧아요)<br><b>시간·비용<\/b>: 관람 약 2시간 · 터너전 1인 ¥2,400(상설전 포함 여부는 확인) · 9:30 개관, 1/2부터 영업<br><b>장점<\/b>: 아사쿠사까지 긴자선으로 5분이라 점심을 일찍 먹고 오후가 여유로워요."}}}];

const LS_KEY="tokyo27-checks",NICK_KEY="tokyo27-nick";

function paintChecks(){
  document.querySelectorAll("[data-ck]").forEach(b=>{

let pendingAfterName=[];const queuedIds=new Set();

function toggle(id){

function startSync(){
  if(!FIREBASE_CONFIG||!window.firebase){setSync("지금은 체크가 이 기기에만 저장돼요.");return}
  try{firebase.initializeApp(FIREBASE_CONFIG);const fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}col=fs.collection("checks");mode="shared"}
  catch(e){setSync("공유 설정에 문제가 있어서 이 기기에만 저장돼요.");return}
  setSync("가족 체크를 불러오는 중이에요.");
  const timer=setTimeout(()=>setSync("연결이 늦어요. 연결되면 자동으로 맞춰져요."),10000);
  col.onSnapshot({includeMetadataChanges:true},snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});pending.forEach(id=>{if(checks[id])next[id]=checks[id]});
    checks=next;paintChecks();lsSet(LS_KEY,checks);
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync("가족과 실시간으로 공유 중이에요.")}else setSync("오프라인이에요. 연결되면 자동으로 맞춰져요.");
  },()=>{clearTimeout(timer);setSync("공유 데이터를 불러오지 못해 이 기기에만 저장돼요.");mode="local"});
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function runSeg(id,k,run){
  const M=MAPS[id],s=M.segs[k];if(!s)return Promise.resolve();
  $("#cap-"+id).innerHTML=capText(s);M.mover.setIcon(moverIcon(s.mode));

  if(t.dataset.optsel){setOpt(t.dataset.optsel);return}
  if(t.dataset.show!=null){showBig(+t.dataset.show);return}
  if(t.dataset.ck){toggle(t.dataset.ck)}
  else if(t.dataset.play){play(t.dataset.play)}
  else if(t.dataset.fit){const M=MAPS[t.dataset.fit];if(M){stopPlay(t.dataset.fit);M.fit()}}
  else if(t.dataset.loc){locate(t.dataset.loc)}
  else if(t.dataset.focus){focusOnMap(t.dataset.focus)}
  else if(t.dataset.area!=null){document.querySelectorAll("[data-area]").forEach(c=>c.setAttribute("aria-pressed",c===t));document.querySelectorAll("[data-arealist]").forEach(l=>l.hidden=l.dataset.arealist!==t.dataset.area)}
  else if(t.dataset.copy){const txt=$("#"+t.dataset.copy).textContent;const done=()=>{t.textContent="복사됨";setTimeout(()=>t.textContent="복사",1500)};try{navigator.clipboard.writeText(txt).then(done,()=>{})}catch(_){}}
});
